# Deploy su Netlify: export statico, nessuna funzione, nessun server.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# ---------------------------------------------------------------------------
# Header di sicurezza, su ogni risposta.
# ---------------------------------------------------------------------------
# La CSP ammette solo risorse dello stesso dominio. 'unsafe-inline' resta per
# script e stili perché un export statico non può generare nonce: Next scrive
# script di idratazione inline e le animazioni scrivono stili inline. Il sito
# non carica nulla da terzi (i font sono serviti dal dominio stesso), quindi
# connect, font, media e immagini restano chiusi a 'self'.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"

# ---------------------------------------------------------------------------
# Cache.
# ---------------------------------------------------------------------------
# I file di Next hanno un hash nel nome: cambiano indirizzo quando cambiano, quindi possono restare in cache per sempre.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Foto, loghi e video hanno nomi fissi: una settimana, poi si riconvalida senza bloccare la pagina.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

# ---------------------------------------------------------------------------
# Redirect permanenti dagli indirizzi del sito precedente.
# ---------------------------------------------------------------------------
# Quelle pagine sono indicizzate: un 301 verso la pagina che oggi contiene lo
# stesso contenuto conserva il posizionamento che hanno guadagnato. Le pagine
# dei singoli progetti ora sono la sezione Case study della home; /privacy/ resta
# dov'era.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/progetti/*"
  to = "/#work"
  status = 301
  force = true

[[redirects]]
  from = "/en/projects/*"
  to = "/#work"
  status = 301
  force = true

# l'informativa inglese ha ora una sola versione, in italiano, allo stesso indirizzo di prima
[[redirects]]
  from = "/en/privacy/*"
  to = "/privacy/"
  status = 301
  force = true

[[redirects]]
  from = "/en/*"
  to = "/"
  status = 301
  force = true

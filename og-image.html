<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<!--
  Template per l'immagine social (Open Graph).
  ISTRUZIONI:
  1. Apri questo file nel browser.
  2. Fai uno screenshot del solo riquadro 1200x630 (o usa DevTools > device 1200x630).
     Con Chrome: DevTools (F12) > Ctrl+Shift+P > "Capture node screenshot" sul div .card.
  3. Salva come  assets/og-image.png
  Questo file NON va indicizzato: è solo uno strumento di lavoro.
-->
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;background:#33302b;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif}
  .card{
    width:1200px;height:630px;box-sizing:border-box;
    background:#FBF4E4;color:#26221C;
    padding:80px;display:flex;flex-direction:column;justify-content:space-between;
    background-image:radial-gradient(circle at 82% 20%, rgba(180,124,72,0.18), transparent 55%);
    overflow:hidden;
  }
  .top{display:flex;justify-content:space-between;align-items:center}
  .brand{font-size:26px;font-weight:600;letter-spacing:.02em}
  .brand span{color:#B47C48}
  .tag{font-size:20px;color:#6A6154;letter-spacing:.18em;text-transform:uppercase}
  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:132px;line-height:1;margin:0}
  h1 em{color:#B47C48}
  p{font-size:30px;color:#6A6154;max-width:820px;line-height:1.4;margin:24px 0 0}
  .stack{display:flex;gap:14px;flex-wrap:wrap}
  .stack span{border:1px solid rgba(38,34,28,.15);border-radius:999px;padding:10px 20px;font-size:20px;color:#26221C}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="brand">Omar<span>Bayadi</span></div>
      <div class="tag">IT — Full-stack Developer</div>
    </div>
    <div>
      <h1>Omar <em>Bayadi</em></h1>
      <p>Creo soluzioni digitali dalla logica all'interfaccia, con una forte sensibilità per il design.</p>
    </div>
    <div class="stack">
      <span>Python</span><span>Django</span><span>React</span><span>Flutter</span><span>Docker</span><span>PostgreSQL</span>
    </div>
  </div>
</body>
</html>
